# jubeat_quickskip.ini - keep next to jubeat_quickskip.dll (all keys optional)

[quickskip]

# master switch (0 = log only, no action)
Enabled=1

# panels to hold together while playing (1-16, comma/space separated),
# or a hex bitmask: bit0 = panel 1 ... bit15 = panel 16 (0x9009 = 1,4,13,16)
Keys=1,4,13,16

# hold time in milliseconds
HoldMs=3000

# minimum time between two aborts in milliseconds
CooldownMs=5000

# input state field passed to GFInputDDevGetStateMap(2, field)
MapField=1

# also stop sound effects when aborting
StopSfx=1

# verbose logging
Verbose=0
