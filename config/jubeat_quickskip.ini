# ===========================================================================
#  jubeat_quickskip.ini - 四角快速退出 Mod 配置
#
#  放在 jubeat_quickskip.dll 旁边；可以直接用记事本修改。
#  所有项都可以省略，省略时使用下面的默认值。
# ===========================================================================

[quickskip]

# 总开关：1=启用，0=关闭（关闭后 DLL 只写日志，不影响游戏）
Enabled=1

# 四个角落（1、4、13、16 号键）需要同时按住的时长，单位毫秒。
# 调小=更灵敏（但更容易误触），调大=更不容易误触。
HoldMs=300

# 两次触发之间的最小间隔，单位毫秒，防止连续触发。
CooldownMs=1500

# 读取面板状态用的字段（一般不需要改；1 已在 L44 上验证）。
MapField=1

# 退出本局时是否同时停止音效（建议 1）。
StopSfx=1

# 调试日志：1=记录每次状态变化（默认 0，只在触发/出错时写日志）。
Verbose=0
